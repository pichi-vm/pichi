version: 1
stages:
  firmware:
    extend: qualification.local/base:1
    mounts:
      /tmp: tmpfs
    steps:
      - copy: {path: corium, into: /tmp/corium}
      - exec:
          command: >-
            arma build --kernel /usr/lib/modules/*/vmlinuz
            --config /usr/lib/modules/*/config --initrd /tmp/corium
            --module virtio_pci --module virtio_blk --module virtio_console
            --module dm_mod --module dm_zero --module dm_snapshot
            --module dm_verity --module ext4
            --cmdline bootconfig --dtb attached /boot.pmi
image:
  root: qualification.local/base:1
  boot:
    extract: {from: firmware, path: /boot.pmi}
    define:
      corium.root: ""
      corium.log: debug
      kernel.ro: []
      kernel.console: hvc0
      kernel.systemd.volatile: state
      kernel.systemd.unit: multi-user.target
      kernel.systemd.show_status: "false"
      example.keep: original
      example.delete: present

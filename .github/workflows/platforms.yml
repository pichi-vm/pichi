name: 🧪 platforms

on:
  workflow_call:
    inputs:
      build-appliance:
        description: Build and test a local candidate appliance on each platform
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  NIGHTLY: nightly-2026-07-06

jobs:
  fixtures:
    name: Prepare native qualification fixture
    runs-on: ubuntu-24.04
    steps:
      - name: Create the source filesystem
        run: |
          mkdir -p "$RUNNER_TEMP/root"
          printf 'ID=fedora\nVERSION_ID=43\n' > "$RUNNER_TEMP/root/os-release"
          mkfs.ext4 -q -F -b 4096 -E lazy_itable_init=0 \
            -d "$RUNNER_TEMP/root" "$RUNNER_TEMP/root.ext4" 16M
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-root
          path: ${{ runner.temp }}/root.ext4
          if-no-files-found: error

  test:
    name: 🧪 ${{ matrix.name }}
    needs: fixtures
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: x86-linux
            os: ubuntu-24.04
            runs_on: '["ubuntu-24.04"]'
            guest_musl: x86_64-unknown-linux-musl
            zot_asset: zot-linux-amd64-minimal
            zot_sha256: 8a6e77686bc0e7751766c49828cff6c66b115c854d350c9d936b855463f6c973
          - name: arm-linux
            os: linux-arm64
            runs_on: '["avrea-ubuntu-latest-arm-4-vcpu"]'
            guest_musl: aarch64-unknown-linux-musl
            zot_asset: zot-linux-arm64-minimal
            zot_sha256: 931d687899cc4b1fcad4c026d2792df6132e6de1b2f329aa730dccee14ec0395
          - name: x86-windows
            os: windows-2025
            runs_on: '["windows-2025"]'
            guest_musl: x86_64-unknown-linux-musl
            zot_asset: zot-windows-amd64-minimal.exe
            zot_sha256: d8b29c9cd9d68f46a338a2ae0533991415148587703ec3bd0f909c22604f7bed
          - name: arm-macos
            os: macos-arm64
            runs_on: '["self-hosted","macOS","ARM64","bare-metal","m1"]'
            guest_musl: aarch64-unknown-linux-musl
            zot_asset: zot-darwin-arm64-minimal
            zot_sha256: e352d2a6f3a9cf35bbc473f9fd3ded9431d09eb0367a1d1cedef221080d5e3c2
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 40
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 📦 Install toolchain
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src,clippy,llvm-tools
          rustup default "$NIGHTLY"
          rustup target add x86_64-unknown-none aarch64-unknown-none-softfloat "${{ matrix.guest_musl }}"
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - uses: actions/download-artifact@v4
        with:
          name: qualification-root
          path: tests/fixtures/native-handoff

      - name: Prepare portable fixture tools
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          cp "$(rustc --print sysroot)/lib/rustlib/$host/bin/llvm-objcopy$suffix" \
            "tests/fixtures/native-handoff/strip$suffix"

      - name: 📥 Initialize native Dillo source
        if: runner.os != 'Linux'
        run: git submodule update --init appliance/dillo

      - name: ♻️ Restore build cache
        # Avoid sandbox-denied sudo purge (pichi-vm/pichi#188).
        # Temporary fork until https://github.com/Swatinem/rust-cache/pull/400 lands.
        uses: pichi-vm/rust-cache@c21f30586e995d7bc93110b6538b713925f08b18
        with:
          workspaces: |
            . -> target
            appliance/dillo -> target
          cache-targets: false
          cache-directories: |
            ${{ github.workspace }}/target
            ${{ github.workspace }}/appliance/dillo/target
          save-if: ${{ runner.environment == 'github-hosted' || github.ref == 'refs/heads/main' }}

      - name: 📦 Install Python with TOML support
        if: runner.os != 'macOS'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: 📦 Install relocatable Python on the native Mac runner
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/pichi-python
        with:
          python-version: '3.13'
          activate-environment: true
          venv-path: ${{ runner.temp }}/pichi-python-env
          enable-cache: false
          cache-local-path: ${{ runner.temp }}/pichi-uv-cache

      - name: 🔨 Build the matching native process monitor
        run: python3 .github/scripts/build_monitor.py

      - name: ⚙️ Run native Windows tests outside restrictive Cargo Jobs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = (Resolve-Path .github/scripts/windows-test-runner.ps1).Path
          $runner = ConvertTo-Json -Compress -InputObject @('pwsh', '-NoLogo', '-NoProfile', '-NonInteractive', '-File', $script)
          Add-Content -LiteralPath .cargo/config.toml -Value "`n[target.x86_64-pc-windows-msvc]`nrunner = $runner"

      - name: 📦 Install packaged Dillo
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:nmccallum/pichi
          sudo apt-get install -y dillo-vm
          dpkg-query -W dillo-vm

      - name: 🔨 Build native Dillo
        if: runner.os != 'Linux'
        working-directory: appliance/dillo
        run: |
          cargo "+$NIGHTLY" --config .copr/cargo-config.toml build --locked --release --bin dillo
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          dillo="$GITHUB_WORKSPACE/appliance/dillo/target/release/dillo$suffix"
          if [ "$RUNNER_OS" = macOS ]; then
            printf '%s\n' '<plist version="1.0"><dict><key>com.apple.security.hypervisor</key><true/></dict></plist>' > "$RUNNER_TEMP/hypervisor.plist"
            codesign --force --sign - --entitlements "$RUNNER_TEMP/hypervisor.plist" "$dillo"
          fi
          echo "$GITHUB_WORKSPACE/appliance/dillo/target/release" >> "$GITHUB_PATH"

      - name: ⚙️ Prepare KVM
        if: runner.os == 'Linux'
        run: |
          sudo chmod a+rw /dev/kvm
          want=${{ inputs.build-appliance && 4096 || 1792 }}
          for attempt in 1 2 3 4 5 6; do
            if [ "$(cat /proc/sys/vm/nr_hugepages)" -ge "$want" ]; then break; fi
            sync
            echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null
            echo 1 | sudo tee /proc/sys/vm/compact_memory >/dev/null
            sudo sysctl -w vm.nr_hugepages=$want
            sleep 3
          done
          test -r /dev/kvm && test -w /dev/kvm
          test "$(cat /proc/sys/vm/nr_hugepages)" -ge "$want"

      - name: 🔎 Check code with Clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: 🧪 Run workspace tests
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
          ZOT_ASSET: ${{ matrix.zot_asset }}
          ZOT_SHA256: ${{ matrix.zot_sha256 }}
        run: bash .github/scripts/test-registry.sh

      - name: 🧪 Verify native monitor and opaque build channel
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
        run: |
          cargo test --locked -p pichi --lib native_monitor_launch_and_async_control -- --ignored --nocapture
          cargo test --locked -p pichi --test cmd_run build_channel_preserves_guest_first_exchange -- --ignored --nocapture

      - name: ⚙️ Create private Windows appliance cache
        if: inputs.build-appliance && runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'appliance-image-cache'
          New-Item -ItemType Directory -Path $cache -ErrorAction Stop | Out-Null
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $acl = [System.Security.AccessControl.DirectorySecurity]::new()
          $acl.SetSecurityDescriptorSddlForm("D:P(A;OICI;FA;;;$sid)")
          Set-Acl -LiteralPath $cache -AclObject $acl

      - name: 🔨 Build candidate appliance
        if: inputs.build-appliance
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/appliance-image-cache
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          pichi=("$GITHUB_WORKSPACE/target/debug/pichi$suffix")
          if [ "$RUNNER_OS" = Windows ]; then
            pichi=(pwsh -NoLogo -NoProfile -NonInteractive -File \
              "$GITHUB_WORKSPACE/.github/scripts/windows-test-runner.ps1" "${pichi[@]}")
          fi
          digest=$(sed -n 's/^  "ghcr.io\/pichi-vm\/fedora:43": //p' appliance/image/pichi.lock)
          builder=$(sed -n 's/^pub const DEFAULT_BUILD_IMAGE: &str = "\(.*\)";$/\1/p' src/cmd/build.rs)
          # Retry downloads before launching any VM; completed layers stay cached.
          for image in "ghcr.io/pichi-vm/fedora@$digest" "$builder"; do
            for attempt in 1 2 3; do
              if "${pichi[@]}" pull "$image"; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              echo "::warning::Image pull failed; retrying ($attempt/3): $image"
              sleep 5
            done
          done
          "${pichi[@]}" build . --ref HEAD --plan appliance/image/pichi.yaml --lock appliance/image/pichi.lock \
            --memory 8192 -t qualification.local/appliance:build
          rm -rf tests/fixtures/appliance-layout
          "${pichi[@]}" save qualification.local/appliance:build -o tests/fixtures/appliance-layout

      - name: 🧪 Exercise commands and build
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
          ZOT_ASSET: ${{ matrix.zot_asset }}
          ZOT_SHA256: ${{ matrix.zot_sha256 }}
        run: |
          test=every_command_builds_and_boots
          if [ '${{ inputs.build-appliance }}' = true ]; then test=candidate_appliance_builds_and_boots; fi
          bash .github/scripts/test-registry.sh bash .github/scripts/test-commands.sh "$test"

      - name: ⬆️ Upload qualified appliance
        if: inputs.build-appliance && runner.os == 'Linux' && github.ref == 'refs/heads/main'
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appliance-oci-${{ runner.arch == 'X64' && 'amd64' || 'arm64' }}
          path: tests/fixtures/appliance-layout
          if-no-files-found: error

      - name: Qualify the published default appliance
        run: |
          cargo --config .cargo/config.toml install --locked --git https://github.com/pichi-vm/corium \
            --rev c33ae0e01d58b657f8f62cb91672885326a903b9 \
            --target "${{ matrix.guest_musl }}" --root tests/fixtures/native-handoff/corium-release corium
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          pichi="$GITHUB_WORKSPACE/target/debug/pichi$suffix"
          default=$(sed -n 's/^pub const DEFAULT_BUILD_IMAGE: &str = "\(.*\)";$/\1/p' src/cmd/build.rs)
          "$pichi" pull "$default"
          "$pichi" inspect "$default" | tee "$RUNNER_TEMP/default-native-image.json"
          "$pichi" save "$default" -o tests/fixtures/native-handoff/appliance-layout
          vm_tests=(--locked -p pichi --features vm-tests --test build_boot --test build_submodules --test staged_images)
          cargo test "${vm_tests[@]}" -- --list | tr -d '\r' | tee "$RUNNER_TEMP/default-native-list.txt"
          for test in pichi_build_boots_official_image_to_poweroff pichi_build_checks_committed_submodule_stores staged_images_create_extend_and_compose; do
            grep -Fxq "$test: test" "$RUNNER_TEMP/default-native-list.txt"
          done
          cargo test "${vm_tests[@]}" --no-fail-fast -- --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/default-native-tests.log"

      - name: ⬆️ Upload failed-command logs
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/zot.log
            ${{ runner.temp }}/command-tests.txt
            ${{ runner.temp }}/default-native-image.json
            ${{ runner.temp }}/default-native-list.txt
            ${{ runner.temp }}/default-native-tests.log
            ${{ runner.temp }}/pichi command smoke */*.log
            ${{ runner.temp }}/pichi command smoke */pichi.yaml
            ${{ runner.temp }}/pichi command smoke */pichi.lock

      - name: Remove qualification fixtures
        if: always()
        run: rm -rf tests/fixtures/native-handoff

      - name: 🧹 Remove temporary monitor checkout
        if: ${{ always() && env.PICHI_MONITOR_SOURCE != '' }}
        run: python3 .github/scripts/build_monitor.py --cleanup

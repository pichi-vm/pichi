name: 🧪 platforms

on:
  workflow_call:
    inputs:
      build-appliance:
        description: Build and test a local candidate appliance on each platform
        type: boolean
        default: false
      compatibility:
        description: Report previous-version build compatibility (non-blocking)
        type: boolean
        default: true
      previous-appliance:
        description: Digest-pinned appliance from the change base
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  NIGHTLY: nightly-2026-07-06
  PICHI_TEST_COMPATIBILITY: ${{ inputs.compatibility }}
  PICHI_TEST_PREVIOUS_BUILD_IMAGE: ${{ inputs.previous-appliance }}

jobs:
  test:
    name: 🧪 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-linux
            os: ubuntu-24.04
            runs_on: '["ubuntu-24.04"]'
            guest_musl: x86_64-unknown-linux-musl
            zot_asset: zot-linux-amd64-minimal
            zot_sha256: 8a6e77686bc0e7751766c49828cff6c66b115c854d350c9d936b855463f6c973
          - name: arm-linux
            os: linux-arm64
            runs_on: '["avrea-ubuntu-latest-arm-4-vcpu"]'
            guest_musl: aarch64-unknown-linux-musl
            zot_asset: zot-linux-arm64-minimal
            zot_sha256: 931d687899cc4b1fcad4c026d2792df6132e6de1b2f329aa730dccee14ec0395
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 40
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 📦 Install toolchain
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src,clippy
          rustup default "$NIGHTLY"
          rustup target add x86_64-unknown-none aarch64-unknown-none-softfloat "${{ matrix.guest_musl }}"
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: 📥 Initialize native Dillo source
        if: runner.os != 'Linux'
        run: git submodule update --init appliance/dillo

      - name: ♻️ Restore build cache
        # Avoid sandbox-denied sudo purge (pichi-vm/pichi#188).
        # Temporary fork until https://github.com/Swatinem/rust-cache/pull/400 lands.
        uses: pichi-vm/rust-cache@c21f30586e995d7bc93110b6538b713925f08b18
        with:
          workspaces: |
            . -> target
            appliance/dillo -> target
          cache-targets: false
          cache-directories: |
            ${{ github.workspace }}/target
            ${{ github.workspace }}/appliance/dillo/target
          save-if: ${{ runner.environment == 'github-hosted' || github.ref == 'refs/heads/main' }}

      - name: 📦 Install Python with TOML support
        if: runner.os != 'macOS'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: 📦 Install relocatable Python on the native Mac runner
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/pichi-python
        with:
          python-version: '3.13'
          activate-environment: true
          venv-path: ${{ runner.temp }}/pichi-python-env
          enable-cache: false
          cache-local-path: ${{ runner.temp }}/pichi-uv-cache

      - name: 🔨 Build the matching native process monitor
        run: python3 .github/scripts/build_monitor.py

      - name: ⚙️ Run native Windows tests outside restrictive Cargo Jobs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = (Resolve-Path .github/scripts/windows-test-runner.ps1).Path
          $runner = ConvertTo-Json -Compress -InputObject @('pwsh', '-NoLogo', '-NoProfile', '-NonInteractive', '-File', $script)
          Add-Content -LiteralPath .cargo/config.toml -Value "`n[target.x86_64-pc-windows-msvc]`nrunner = $runner"

      - name: Install the packaged build runtime
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:nmccallum/pichi
          sudo apt-get install -y dillo-vm pichi madrillo
          dpkg-query -W -f '${Package} ${Version} ${Architecture}\n' dillo-vm pichi madrillo
          test "$(dpkg-query -W -f '${Version}' pichi)" = '0.1.0~dev+202611080202~ubuntu24.04.1'
          sha256sum /usr/bin/pichi /usr/bin/dillo /usr/bin/madrillo

      - name: 📦 Install Pichi for compatibility checks
        if: runner.os == 'Linux' && inputs.compatibility
        run: |
          if ! sudo apt-get install -y pichi; then
            echo '::warning::Packaged Pichi unavailable; compatibility checks will report failure.'
          fi

      - name: 🔨 Build native Dillo
        if: runner.os != 'Linux'
        working-directory: appliance/dillo
        run: |
          cargo "+$NIGHTLY" --config .copr/cargo-config.toml build --locked --release --bin dillo
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          dillo="$GITHUB_WORKSPACE/appliance/dillo/target/release/dillo$suffix"
          if [ "$RUNNER_OS" = macOS ]; then
            printf '%s\n' '<plist version="1.0"><dict><key>com.apple.security.hypervisor</key><true/></dict></plist>' > "$RUNNER_TEMP/hypervisor.plist"
            codesign --force --sign - --entitlements "$RUNNER_TEMP/hypervisor.plist" "$dillo"
          fi
          echo "$GITHUB_WORKSPACE/appliance/dillo/target/release" >> "$GITHUB_PATH"

      - name: ⚙️ Prepare KVM
        if: runner.os == 'Linux'
        run: |
          sudo chmod a+rw /dev/kvm
          want=${{ inputs.build-appliance && 4096 || 1792 }}
          for attempt in 1 2 3 4 5 6; do
            if [ "$(cat /proc/sys/vm/nr_hugepages)" -ge "$want" ]; then break; fi
            sync
            echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null
            echo 1 | sudo tee /proc/sys/vm/compact_memory >/dev/null
            sudo sysctl -w vm.nr_hugepages=$want
            sleep 3
          done
          test -r /dev/kvm && test -w /dev/kvm
          test "$(cat /proc/sys/vm/nr_hugepages)" -ge "$want"

      - name: 🔎 Check code with Clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: 🧪 Run workspace tests
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
          ZOT_ASSET: ${{ matrix.zot_asset }}
          ZOT_SHA256: ${{ matrix.zot_sha256 }}
        run: bash .github/scripts/test-registry.sh

      - name: 🧪 Verify native monitor and opaque build channel
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
        run: |
          cargo test --locked -p pichi --lib native_monitor_launch_and_async_control -- --ignored --nocapture
          cargo test --locked -p pichi --test cmd_run build_channel_preserves_guest_first_exchange -- --ignored --nocapture

      - name: ⚙️ Create private Windows appliance cache
        if: inputs.build-appliance && runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'appliance-image-cache'
          New-Item -ItemType Directory -Path $cache -ErrorAction Stop | Out-Null
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $acl = [System.Security.AccessControl.DirectorySecurity]::new()
          $acl.SetSecurityDescriptorSddlForm("D:P(A;OICI;FA;;;$sid)")
          Set-Acl -LiteralPath $cache -AclObject $acl

      - name: 🔨 Build candidate appliance
        if: inputs.build-appliance
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/appliance-image-cache
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          pichi=("$GITHUB_WORKSPACE/target/debug/pichi$suffix")
          if [ "$RUNNER_OS" = Windows ]; then
            pichi=(pwsh -NoLogo -NoProfile -NonInteractive -File \
              "$GITHUB_WORKSPACE/.github/scripts/windows-test-runner.ps1" "${pichi[@]}")
          fi
          digest=$(sed -n 's/^  "ghcr.io\/pichi-vm\/fedora:43": //p' appliance/image/pichi.lock)
          "${pichi[@]}" pull "ghcr.io/pichi-vm/fedora@$digest"
          "${pichi[@]}" build . --ref HEAD --plan appliance/image/pichi.yaml --lock appliance/image/pichi.lock \
            --build-image ghcr.io/pichi-vm/conglobate@sha256:8138d258113a161c831e7bad8a2d1fbf7abc9357b4d10637305c9d811a5f3237 \
            --memory 8192 -t qualification.local/appliance:build
          "${pichi[@]}" save qualification.local/appliance:build -o "$RUNNER_TEMP/appliance-layout"
          echo "PICHI_TEST_BUILD_IMAGE_LAYOUT=$RUNNER_TEMP/appliance-layout" >> "$GITHUB_ENV"

      - name: Build and boot with the packaged runtime
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
          PICHI_SMOKE_BIN: /usr/bin/pichi
        run: |
          qualification_rustup=$(command -v rustup)
          export PATH="/usr/bin:$PATH"
          command -v pichi dillo madrillo
          unset PICHI_TEST_PREVIOUS_BUILD_IMAGE
          "$qualification_rustup" run "$NIGHTLY" cargo test --locked --test command_smoke -- \
            --ignored --exact every_command_builds_and_boots --nocapture

      - name: Verify SELinux labeling inside the build namespace
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/namespace-label-cache
        run: |
          export PATH="/usr/bin:$PATH"
          pichi=/usr/bin/pichi
          image=$(sed -n 's/^pub const DEFAULT_BUILD_IMAGE: &str = "\(.*\)";$/\1/p' src/cmd/build.rs)
          "$pichi" pull "$image"
          "$pichi" inspect "$image" > "$RUNNER_TEMP/namespace-label-builder.json"
          "$pichi" tag "$image" localhost/label-tools
          "$pichi" build . --ref HEAD --plan tests/namespace_labels/pichi.yaml \
            --memory 2048 -t qualification.local/namespace-label:out \
            2>&1 | tee "$RUNNER_TEMP/namespace-label.log"
          grep -F PICHI_NAMESPACE_LABEL_OK "$RUNNER_TEMP/namespace-label.log"
          "$pichi" inspect qualification.local/namespace-label:out > "$RUNNER_TEMP/namespace-label-output.json"

      - name: ⬆️ Upload qualified appliance
        if: inputs.build-appliance && runner.os == 'Linux' && github.ref == 'refs/heads/main'
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appliance-oci-${{ runner.arch == 'X64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/appliance-layout
          if-no-files-found: error

      - name: ⬆️ Upload failed-command logs
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/namespace-label*.json
            ${{ runner.temp }}/namespace-label.log
            ${{ runner.temp }}/zot.log
            ${{ runner.temp }}/command-tests.txt
            ${{ runner.temp }}/pichi command smoke */*.log
            ${{ runner.temp }}/pichi command smoke */pichi.yaml
            ${{ runner.temp }}/pichi command smoke */pichi.lock

      - name: Remove the qualification cache
        if: always()
        run: rm -rf "$RUNNER_TEMP/namespace-label-cache"

      - name: 🧹 Remove temporary monitor checkout
        if: ${{ always() && env.PICHI_MONITOR_SOURCE != '' }}
        run: python3 .github/scripts/build_monitor.py --cleanup

name: platforms

on:
  workflow_call:
    inputs:
      appliance-artifacts:
        description: Test the appliance images built by this workflow run
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  NIGHTLY: nightly-2026-07-06

# Supported platforms are Linux x86_64/aarch64 (KVM), Windows x86_64 (WHP),
# and macOS arm64 (HVF on bare-metal organization runners).
jobs:
  appliance:
    if: inputs.appliance-artifacts
    uses: ./.github/workflows/appliance.yml

  fixtures:
    name: portable filesystem fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create smoke root
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/root"
          printf 'ID=fedora\nVERSION_ID=43\n' > "$RUNNER_TEMP/root/os-release"
          mkfs.ext4 -q -F -b 4096 -d "$RUNNER_TEMP/root" "$RUNNER_TEMP/root.ext4" 16M
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-root
          path: ${{ runner.temp }}/root.ext4
          if-no-files-found: error

  ci:
    needs: [fixtures, appliance]
    if: ${{ !cancelled() && needs.fixtures.result == 'success' && (!inputs.appliance-artifacts || needs.appliance.result == 'success') }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04      # Linux x86_64 - full workspace + real KVM boot
            os: ubuntu-24.04
            runs_on: '["ubuntu-24.04"]'
            guest_musl: x86_64-unknown-linux-musl
            zot_asset: zot-linux-amd64-minimal
            zot_sha256: 8a6e77686bc0e7751766c49828cff6c66b115c854d350c9d936b855463f6c973
          - name: linux-arm64       # Linux arm64 - real KVM boot
            os: linux-arm64
            runs_on: '["self-hosted","Linux","ARM64","bare-metal","aarch64","kvm"]'
            guest_musl: aarch64-unknown-linux-musl
            zot_asset: zot-linux-arm64-minimal
            zot_sha256: 931d687899cc4b1fcad4c026d2792df6132e6de1b2f329aa730dccee14ec0395
          - name: windows-2025      # Windows x86_64 - build + real WHP boot
            os: windows-2025
            runs_on: '["windows-2025"]'
            guest_musl: x86_64-unknown-linux-musl
            zot_asset: zot-windows-amd64-minimal.exe
            zot_sha256: d8b29c9cd9d68f46a338a2ae0533991415148587703ec3bd0f909c22604f7bed
          - name: macos-arm64       # macOS arm64 - real HVF boot
            os: macos-arm64
            runs_on: '["self-hosted","macOS","ARM64","bare-metal","m1"]'
            guest_musl: aarch64-unknown-linux-musl
            zot_asset: zot-darwin-arm64-minimal
            zot_sha256: e352d2a6f3a9cf35bbc473f9fd3ded9431d09eb0367a1d1cedef221080d5e3c2
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    # A hung test must not hold the only Mac runner for hours.
    timeout-minutes: ${{ matrix.os == 'macos-arm64' && 60 || 360 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Provide Python on minimal NixOS runners
        shell: bash
        run: |
          if ! command -v python3 >/dev/null; then
            python=$(nix --extra-experimental-features 'nix-command flakes' build \
              --out-link "$RUNNER_TEMP/pichi-ci-python" --print-out-paths \
              github:NixOS/nixpkgs/7dcdd87373d72e7a2173e4db02e20d3d7f495cfd#python313)
            echo "$python/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Python with TOML support
        if: matrix.os != 'linux-arm64'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src,clippy,llvm-tools
          rustup default "$NIGHTLY"
          # arma embeds native-arch tatu; snuffler is cross-built for the guest
          # musl triple matching this host's arch.
          rustup target add x86_64-unknown-none aarch64-unknown-none-softfloat "${{ matrix.guest_musl }}"

      - uses: actions/download-artifact@v4
        with:
          name: smoke-root
          path: ${{ runner.temp }}/fixtures

      - name: Configure portable fixture tools
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          echo "PICHI_TEST_STRIP=$(rustc --print sysroot)/lib/rustlib/$host/bin/llvm-objcopy$suffix" >> "$GITHUB_ENV"
          echo "PICHI_TEST_ROOT_FILESYSTEM=$RUNNER_TEMP/fixtures/root.ext4" >> "$GITHUB_ENV"
          git config --global core.longpaths true
          git config --global core.autocrlf false

      # The boot step (`--features vm-tests`) consumes arma/dillo/conglobate/corium
      # as git artifact deps, whose transitive tatu/snuffler artifact deps target
      # non-default triples. The cargo bug that panicked on this
      # (rust-lang/cargo#10647) is fixed in the pinned nightly, so stock cargo
      # resolves the graph — no patched cargo needed.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ runner.environment == 'github-hosted' || github.ref == 'refs/heads/main' }}

      - name: Build the matching native process monitor
        shell: bash
        run: python3 .github/scripts/build_monitor.py

      - name: Run native Windows tests outside restrictive Cargo Jobs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = (Resolve-Path .github/scripts/windows-test-runner.ps1).Path
          $runner = ConvertTo-Json -Compress -InputObject @('pwsh', '-NoLogo', '-NoProfile', '-NonInteractive', '-File', $script)
          # Cargo string runners do not interpret shell quotes. Use its array
          # form so an absolute path remains one argument, even with spaces.
          Add-Content -LiteralPath .cargo/config.toml -Value "`n[target.x86_64-pc-windows-msvc]`nrunner = $runner"

      - name: Versions
        shell: bash
        run: |
          cargo --version
          rustc --version

      # ARM workspace checks run on hosted runners in the workspace job.
      - name: Clippy
        if: runner.arch != 'ARM64'
        shell: bash
        run: cargo clippy --locked --workspace --all-targets --all-features

      - name: Enable KVM (Linux)
        # Backend tests and boot fixtures may touch /dev/kvm during the plain
        # workspace test run, so access must be granted before it.
        if: runner.os == 'Linux'
        run: |
          test -c /dev/kvm
          if ! [ -r /dev/kvm ] || ! [ -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm

      # `CARGO_BUILD_RUSTFLAGS: -D warnings` (set per cargo step below) makes the
      # build warning-clean-or-fail. It is the lowest-priority rustflags source,
      # so it applies to the host/workspace crates but is ignored for the musl
      # snuffler target, which keeps its own linker flags from .cargo/config.toml.
      # (Registry deps are cap-lints'd, so only our crates can fail it.) It is set
      # per-step, never globally, so it can't reach the patched-cargo build above.

      - name: Test full workspace and registry
        if: runner.arch != 'ARM64'
        shell: bash
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
          ZOT_ASSET: ${{ matrix.zot_asset }}
          ZOT_SHA256: ${{ matrix.zot_sha256 }}
        run: bash .github/scripts/test-registry.sh

      - name: Native monitor launch and reconnect
        shell: bash
        run: cargo test --locked -p pichi --lib native_monitor_launch_and_async_control -- --ignored --nocapture

      - name: Reserve hugepages for guest RAM (Linux/KVM)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Hosted runners start with a fragmented page allocator, so a single
          # `sysctl -w vm.nr_hugepages=1536` often only secures a fraction (we
          # have seen ~132). Free the page cache + compact memory and retry a
          # few times so enough 2 MiB-contiguous regions become available before
          # giving up. This is allocation flakiness, not a capability gap.
          # VM tests run sequentially: 3.5 GiB for builds, 2 GiB for boots.
          # Build snapshots and verity trees share the guest's RAM workspace.
          # Leave room below Dillo's current 4 GiB placement ceiling.
          want=1792
          pages=$(sysctl -n vm.nr_hugepages)
          for attempt in 1 2 3 4 5 6; do
            if [ "$pages" -ge "$want" ]; then break; fi
            sync || true
            echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null || true
            echo 1 | sudo tee /proc/sys/vm/compact_memory >/dev/null || true
            sudo sysctl -w vm.nr_hugepages=$want || true
            pages=$(sysctl -n vm.nr_hugepages)
            echo "hugepage reservation attempt $attempt: nr_hugepages=$pages (want $want)"
            sleep 3
          done

          if [ "$pages" -lt "$want" ]; then
            echo "Linux runner must provide vm.nr_hugepages >= $want; got $pages" >&2
            exit 1
          fi

          grep -i huge /proc/meminfo

      - name: Build guest tools for staged images
        shell: bash
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          cargo install -Z bindeps --locked --git https://github.com/pichi-vm/arma \
            --rev 3297920b46122689fb13ca41acd61cbe94ac1de7 \
            --target "${{ matrix.guest_musl }}" --root "$RUNNER_TEMP/arma-guest" arma
          cargo install --locked --git https://github.com/pichi-vm/corium \
            --rev c33ae0e01d58b657f8f62cb91672885326a903b9 \
            --target "${{ matrix.guest_musl }}" --root "$RUNNER_TEMP/corium-release" corium
          echo "PICHI_TEST_GUEST_ARMA=$RUNNER_TEMP/arma-guest/bin/arma" >> "$GITHUB_ENV"
          echo "PICHI_TEST_REPLACEMENT_CORIUM=$RUNNER_TEMP/corium-release/bin/corium" >> "$GITHUB_ENV"
          echo "PICHI_TEST_EVIDENCE=$RUNNER_TEMP/staged-image-evidence" >> "$GITHUB_ENV"

      - name: Download the rebuilt appliance
        if: inputs.appliance-artifacts
        uses: actions/download-artifact@v4
        with:
          name: appliance-oci-${{ runner.arch == 'X64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/appliance-layout

      - name: Use the rebuilt appliance for VM tests
        if: inputs.appliance-artifacts
        shell: bash
        run: echo "PICHI_TEST_BUILD_IMAGE_LAYOUT=$RUNNER_TEMP/appliance-layout" >> "$GITHUB_ENV"

      # Require every acceptance suite to be present before running it. An OS
      # cfg gate must never turn a native VM job into a green zero-test run.
      # These suites build and boot Fedora images using KVM, WHP, or HVF.
      - name: Boot tests (KVM / WHP / HVF)
        shell: bash
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
        run: |
          vm_tests=(--locked -p pichi --features vm-tests --test build_boot --test build_submodules --test staged_images)
          cargo test "${vm_tests[@]}" -- --list | tr -d '\r' | tee "$RUNNER_TEMP/vm-tests.txt"
          for test in pichi_build_boots_official_image_to_poweroff pichi_build_checks_committed_submodule_stores staged_images_create_extend_and_compose; do
            if ! grep -Fxq "$test: test" "$RUNNER_TEMP/vm-tests.txt"; then
              echo "Missing native VM acceptance test: $test" >&2
              exit 1
            fi
          done
          cargo test "${vm_tests[@]}" --no-fail-fast -- --test-threads=1 --nocapture

      - name: Preserve staged-image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staged-image-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/zot.log
            ${{ runner.temp }}/staged-image-evidence/**/*.log
            ${{ runner.temp }}/staged-image-evidence/**/manifest.json
            ${{ runner.temp }}/staged-image-evidence/**/root-sectors.json
            ${{ runner.temp }}/staged-image-evidence/**/bootconfig
            ${{ runner.temp }}/staged-image-evidence/**/pichi.yaml
            ${{ runner.temp }}/staged-image-evidence/**/pichi.lock
            ${{ runner.temp }}/staged-image-evidence/**/PASS

      - name: Remove the monitor build checkout
        if: always() && env.PICHI_MONITOR_SOURCE != ''
        shell: bash
        run: python3 .github/scripts/build_monitor.py --cleanup

      - name: Release the CI Python store reference
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pichi-ci-python"

  workspace:
    name: workspace checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            zot_asset: zot-linux-arm64-minimal
            zot_sha256: 931d687899cc4b1fcad4c026d2792df6132e6de1b2f329aa730dccee14ec0395
          - os: macos-15
            zot_asset: zot-darwin-arm64-minimal
            zot_sha256: e352d2a6f3a9cf35bbc473f9fd3ded9431d09eb0367a1d1cedef221080d5e3c2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src,clippy,llvm-tools
          rustup default "$NIGHTLY"
          rustup target add x86_64-unknown-none aarch64-unknown-none-softfloat aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        shell: bash
        run: cargo clippy --locked --workspace --all-targets --all-features

      - name: Build the matching native process monitor
        shell: bash
        run: python3 .github/scripts/build_monitor.py

      - name: Test full workspace and registry
        shell: bash
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
          ZOT_ASSET: ${{ matrix.zot_asset }}
          ZOT_SHA256: ${{ matrix.zot_sha256 }}
        run: bash .github/scripts/test-registry.sh

      - name: Remove the monitor build checkout
        if: always() && env.PICHI_MONITOR_SOURCE != ''
        shell: bash
        run: python3 .github/scripts/build_monitor.py --cleanup

name: Avrea artifact download diagnostic
'on':
  push:
    branches:
    - probe/avrea-artifact-download
permissions:
  contents: read
  actions: read
jobs:
  download:
    runs-on: avrea-ubuntu-latest-arm-1-vcpu
    timeout-minutes: 7
    steps:
    - name: Fetch artifact with curl and validate archive
      timeout-minutes: 4
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'PYTHON'
        import urllib.request, urllib.error, os, subprocess, hashlib, zipfile, time
        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl): return None
        request = urllib.request.Request('https://api.github.com/repos/pichi-vm/pichi/actions/artifacts/13528563470/zip', headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
        try:
            urllib.request.build_opener(NoRedirect).open(request, timeout=20)
            raise RuntimeError('Expected artifact redirect')
        except urllib.error.HTTPError as response:
            if response.code != 302: raise
            url = response.headers['Location']
        for start in [0, 160000000, 316000000]:
            print('Testing 8 MB range at offset', start, flush=True)
            result = subprocess.run(['curl', '--fail', '--silent', '--show-error', '--connect-timeout', '10', '--max-time', '30', '--range', f'{start}-{start+7999999}', '--output', '/dev/null', '--write-out', 'HTTP=%{http_code} bytes=%{size_download} seconds=%{time_total} speed=%{speed_download} remote=%{remote_ip}\n', url])
            print('curl exit:', result.returncode, flush=True)
        PYTHON

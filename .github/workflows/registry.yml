name: registry

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  NIGHTLY: nightly-2026-07-06

jobs:
  # Every native platform also runs the complete workspace against a local
  # Zot registry in platforms.yml. Keep this additional vendor compatibility
  # check for the hosted registry's authentication and media-type handling.
  # Real network round-trip against ghcr.io, a major production registry.
  # Validates that pichi's custom OCI artifact format (vnd.pichi.* media
  # types, empty-config artifact, verity annotations) is accepted and served
  # bit-identically by a strict, real-world implementation. Runs only on
  # push/dispatch: fork-PR GITHUB_TOKENs are read-only for packages.
  registry-ghcr:
    name: ghcr.io / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: windows-amd64
            os: windows-2025
          - name: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TEST_PACKAGE_PREFIX: pichi-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          rustup default "$NIGHTLY"

      - uses: Swatinem/rust-cache@v2

      - name: Write ghcr.io auth file
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/auth"
          auth=$(printf '%s:%s' '${{ github.actor }}' "$GHCR_TOKEN" | base64 | tr -d '\r\n')
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" > "$RUNNER_TEMP/auth/auth.json"

      - name: Round-trip test (ghcr.io)
        shell: bash
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
          PICHI_TEST_REGISTRY: ghcr.io
          PICHI_TEST_REPO_BASE: ghcr.io/${{ github.repository_owner }}/${{ env.TEST_PACKAGE_PREFIX }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth/auth.json
        run: |
          # Two cases publish to the same new package. Serialize its creation
          # so GHCR grants the package permissions before the next client auths.
          cargo test --locked -p pichi --test cmd_pull_push_roundtrip -- --test-threads=1

      - name: Delete test package (cleanup)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in roundtrip index-pin; do
            gh api -X DELETE \
              "orgs/${{ github.repository_owner }}/packages/container/$TEST_PACKAGE_PREFIX%2F$package" \
              && echo "deleted $TEST_PACKAGE_PREFIX/$package" \
              || echo "cleanup skipped (no package, or token lacks delete:packages)"
          done

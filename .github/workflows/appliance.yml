name: Investigate ARM debug linking

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: [self-hosted, Linux, ARM64, bare-metal, aarch64, kvm]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: /tmp
        shell: bash
    env:
      NIGHTLY: nightly-2026-07-06
      RUSTUP_TOOLCHAIN: nightly-2026-07-06
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Preserve the original archive if this is the failing workspace
        run: |
          link_case_dir=$(mktemp -d "$RUNNER_TEMP/arm-link-repro.XXXXXX")
          mkdir "$link_case_dir/evidence" "$link_case_dir/src"
          echo "CASE_DIR=$link_case_dir" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$link_case_dir/cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$link_case_dir/target" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_NAME" > "$link_case_dir/evidence/runner.txt"
          original="$GITHUB_WORKSPACE/target/debug/deps/libdifflib-35bf61ef26f591dc.rlib"
          if [ "$RUNNER_NAME" = ares-1 ] && [ -f "$original" ]; then
            stamp=$(stat -c %Y "$original")
            first=$(date -u -d '2026-11-06 07:19:45 UTC' +%s)
            last=$(date -u -d '2026-11-06 07:20:50 UTC' +%s)
            stat "$original" > "$link_case_dir/evidence/original-stat.txt"
            git -C "$GITHUB_WORKSPACE" log -1 --format='%H%n%P' > "$link_case_dir/evidence/original-checkout.txt"
            if [ "$stamp" -ge "$first" ] && [ "$stamp" -le "$last" ]; then
              cp "$original" "$link_case_dir/evidence/original-difflib.rlib"
            fi
          fi
      - name: Record and prepare the matching toolchain
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          rustup component add llvm-tools-preview --toolchain "$NIGHTLY"
          {
            uname -a
            rustc -vV
            cc --version
            cc -print-prog-name=ld
            ld.bfd --version
          } > "$CASE_DIR/evidence/toolchain.txt"
          sysroot=$(rustc --print sysroot)
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "LLVM_READOBJ=$sysroot/lib/rustlib/$host/bin/llvm-readobj" >> "$GITHUB_ENV"
      - name: Link a minimal matching dependency build
        run: |
          cat > "$CASE_DIR/Cargo.toml" <<'TOML'
          [package]
          name = "arm-link-repro"
          version = "0.0.0"
          edition = "2024"
          [dependencies]
          difflib = "=0.4.0"
          [profile.dev.package."*"]
          opt-level = 3
          TOML
          cat > "$CASE_DIR/Cargo.lock" <<'LOCK'
          version = 4
          [[package]]
          name = "arm-link-repro"
          version = "0.0.0"
          dependencies = ["difflib"]
          [[package]]
          name = "difflib"
          version = "0.4.0"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "6184e33543162437515c2e2b48714794e37845ec9851711914eec9d308f6ebe8"
          LOCK
          cat > "$CASE_DIR/src/lib.rs" <<'RS'
          #[test]
          fn link_difflib() {
              let matches = difflib::get_close_matches("image", vec!["image", "build"], 1, 0.5);
              assert!(!std::hint::black_box(matches).is_empty());
              let diff = difflib::unified_diff(&["a"], &["b"], "a", "b", "", "", 3);
              assert!(!std::hint::black_box(diff).is_empty());
          }
          RS
          status=0
          cargo test --manifest-path "$CASE_DIR/Cargo.toml" --locked -vv > "$CASE_DIR/evidence/build.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$CASE_DIR/evidence/test-status"
          cp "$CASE_DIR/Cargo.toml" "$CASE_DIR/Cargo.lock" "$CASE_DIR/evidence/"
          cat "$CASE_DIR/evidence/build.log"
          exit "$status"
      - name: Inspect produced and preserved archives
        if: always()
        run: |
          shopt -s nullglob
          for archive in "$CASE_DIR"/target/debug/deps/libdifflib-*.rlib; do
            cp "$archive" "$CASE_DIR/evidence/"
          done
          for archive in "$CASE_DIR"/evidence/*.rlib; do
            sha256sum "$archive" >> "$CASE_DIR/evidence/archive-sha256.txt"
            status=0
            readelf --relocs --wide "$archive" > "$archive.gnu-relocs.txt" 2>&1 || status=$?
            printf '%s\n' "$status" > "$archive.gnu-status"
            status=0
            "$LLVM_READOBJ" --symbols --relocations "$archive" > "$archive.llvm-relocs.txt" 2>&1 || status=$?
            printf '%s\n' "$status" > "$archive.llvm-status"
          done
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-linker-evidence
          path: ${{ env.CASE_DIR }}/evidence
      - name: Remove only this diagnostic's compilation scratch
        if: always()
        run: |
          if [[ -n "${CASE_DIR:-}" && "$CASE_DIR" == "$RUNNER_TEMP"/arm-link-repro.* ]]; then
            rm -rf -- "$CASE_DIR/target" "$CASE_DIR/cargo"
          fi

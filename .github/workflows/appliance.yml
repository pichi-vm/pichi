name: appliance

on:
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  NIGHTLY: nightly-2026-07-06

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: avrea-ubuntu-latest-arm-4-vcpu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Reserve build VM memory
        run: |
          sudo chmod a+rw /dev/kvm
          for attempt in 1 2 3 4 5 6; do
            if [ "$(cat /proc/sys/vm/nr_hugepages)" -ge 4096 ]; then break; fi
            sync
            echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null
            echo 1 | sudo tee /proc/sys/vm/compact_memory >/dev/null
            sudo sysctl -w vm.nr_hugepages=4096
            sleep 3
          done
          test -r /dev/kvm && test -w /dev/kvm
          test "$(cat /proc/sys/vm/nr_hugepages)" -ge 4096

      - name: Build Pichi
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          cargo "+$NIGHTLY" build --locked --release --bin pichi
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/appliance-image-cache" >> "$GITHUB_ENV"

      - name: 📦 Install Dillo
        run: |
          sudo add-apt-repository --yes ppa:nmccallum/pichi
          sudo apt-get install -y dillo-vm
          echo "PICHI_DILLO=$(command -v dillo)" >> "$GITHUB_ENV"

      - name: Build the appliance from Fedora
        run: |
          digest=$(sed -n 's/^  "ghcr.io\/pichi-vm\/fedora:43": //p' appliance/image/pichi.lock)
          pichi pull "ghcr.io/pichi-vm/fedora@$digest"
          pichi build . --ref HEAD --plan appliance/image/pichi.yaml --lock appliance/image/pichi.lock \
            --build-image ghcr.io/pichi-vm/conglobate@sha256:dda6d25f6f51ad171611f159f4202bdec4e50482d6e741ad566c1b4d7c61d946 \
            --memory 8192 -t qualification.local/appliance:build
          pichi save qualification.local/appliance:build -o "$RUNNER_TEMP/appliance-layout"

      - name: Build Fedora with the new appliance
        run: |
          digest=$(sed -n 's/^  "ghcr.io\/pichi-vm\/fedora:43": //p' appliance/image/pichi.lock)
          pichi tag "ghcr.io/pichi-vm/fedora@$digest" ghcr.io/pichi-vm/fedora:43
          pichi build . --ref HEAD --context appliance/fedora \
            --build-image qualification.local/appliance:build --memory 8192 \
            -t qualification.local/fedora:build
          pichi inspect qualification.local/fedora:build > "$RUNNER_TEMP/fedora-output.json"

      - name: Preserve the Fedora build result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appliance-fedora-result-${{ matrix.arch }}
          path: ${{ runner.temp }}/fedora-output.json
          if-no-files-found: error

      - name: Upload the native OCI layout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appliance-oci-${{ matrix.arch }}
          path: ${{ runner.temp }}/appliance-layout
          if-no-files-found: error

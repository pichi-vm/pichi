name: Verify defaults appliance archive

on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify archive and every OCI descriptor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          import tempfile
          import zipfile

          repo = 'pichi-vm/pichi'
          result = subprocess.check_output([
              'gh', 'api', f'repos/{repo}/actions/runs/42144626726/artifacts'
          ])
          artifacts = json.loads(result)['artifacts']
          artifact = next(a for a in artifacts if a['name'] == 'appliance-oci-arm64')
          errors = []
          with tempfile.TemporaryFile() as output:
              subprocess.run([
                  'gh', 'api', '--allow-escape-sequences',
                  f'repos/{repo}/actions/artifacts/{artifact["id"]}/zip'
              ], stdout=output, check=True)
              output.seek(0)
              digest = 'sha256:' + hashlib.file_digest(output, 'sha256').hexdigest()
              print('Archive', artifact['id'], 'actual', digest, 'recorded', artifact['digest'])
              if digest != artifact['digest']:
                  errors.append(('archive digest mismatch', digest, artifact['digest']))
              output.seek(0)
              with zipfile.ZipFile(output) as archive:
                  pending = json.loads(archive.read('index.json'))['manifests']
                  seen = set()
                  while pending:
                      descriptor = pending.pop()
                      identity = descriptor['digest']
                      if identity in seen:
                          continue
                      seen.add(identity)
                      algorithm, encoded = identity.split(':', 1)
                      assert algorithm == 'sha256'
                      path = f'blobs/sha256/{encoded}'
                      info = archive.getinfo(path)
                      if info.file_size != descriptor['size']:
                          errors.append(('OCI size mismatch', path, info.file_size, descriptor['size']))
                      with archive.open(path) as blob:
                          actual = hashlib.file_digest(blob, 'sha256').hexdigest()
                      if actual != encoded:
                          errors.append(('OCI digest mismatch', path, actual, encoded))
                      kind = descriptor['mediaType']
                      if kind.endswith('image.index.v1+json'):
                          pending.extend(json.loads(archive.read(path))['manifests'])
                      elif kind.endswith('image.manifest.v1+json'):
                          manifest = json.loads(archive.read(path))
                          pending.extend([manifest['config'], *manifest['layers']])
                  print('Verified', len(seen), 'OCI descriptors')
                  for error in errors:
                      print('ERROR', *error)
                  assert not errors, 'Artifact integrity errors recorded above'
          PY

name: appliance

on:
  workflow_dispatch:
    inputs:
      sample:
        description: Measurement label (seed, warm-1, warm-2)
        required: true
        type: string

run-name: Cache 157 measurement ${{ inputs.sample }}

defaults:
  run:
    shell: bash

env:
  NIGHTLY: nightly-2026-07-06

permissions:
  contents: read

jobs:
  build:
    if: inputs.sample != 'private-pair'
    name: ${{ matrix.runner }} / ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        mode: [baseline, cache]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Record host
        run: |
          lscpu
          free -h

      - name: Install toolchain
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          rustup default "$NIGHTLY"

      - uses: Swatinem/rust-cache@v2
        if: matrix.mode == 'cache'
        with:
          prefix-key: measure-157-v1
          workspaces: |
            . -> target
            appliance/dillo -> target
          cache-targets: false
          cache-directories: |
            ${{ github.workspace }}/target
            ${{ github.workspace }}/appliance/dillo/target
          save-if: true

      - name: Build Pichi
        run: cargo "+$NIGHTLY" build --locked --release --bin pichi

      - name: Build Dillo
        working-directory: appliance/dillo
        run: cargo "+$NIGHTLY" --config packaging/cargo-config.toml build --locked --release --bin dillo

  private-pair:
    if: inputs.sample == 'private-pair'
    runs-on: [self-hosted, Linux, ARM64, bare-metal, aarch64, kvm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: Swatinem/rust-cache
          ref: v2
          path: .measure-rust-cache
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          rustup default "$NIGHTLY"
      - name: Measure cold build and two restored builds on one runner
        env:
          CARGO_HOME: ${{ runner.temp }}/measure-157-cargo
        uses: ./.github/actions/measure-cache

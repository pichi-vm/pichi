name: Hosted hypervisor probes
'on':
  push:
    branches:
    - probe/hosted-hypervisors
permissions:
  contents: read
jobs:
  avrea-macos-hvf:
    runs-on: avrea-macos-26-8-vcpu
    timeout-minutes: 10
    steps:
    - name: Create HVF VM and vCPU
      shell: bash
      run: |
        uname -a
        sw_vers
        sysctl kern.hv_support
        sysctl kern.hv_vmm_present hw.model machdep.cpu.brand_string || true
        cat > /tmp/hvf.c <<'C'
        #include <Hypervisor/Hypervisor.h>
        #include <stdio.h>
        int main(void) {
            hv_return_t r = hv_vm_create(NULL);
            printf("hv_vm_create: 0x%x (HV_UNSUPPORTED=0x%x, HV_DENIED=0x%x)\n", r, HV_UNSUPPORTED, HV_DENIED);
            if (r != HV_SUCCESS) return 1;
            hv_vcpu_t cpu;
            hv_vcpu_exit_t *exit_info;
            r = hv_vcpu_create(&cpu, &exit_info, NULL);
            printf("hv_vcpu_create: 0x%x\n", r);
            if (r == HV_SUCCESS) hv_vcpu_destroy(cpu);
            hv_vm_destroy();
            return r == HV_SUCCESS ? 0 : 1;
        }
        C
        cat > /tmp/hvf.plist <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict><key>com.apple.security.hypervisor</key><true/></dict></plist>
        PLIST
        clang -Wall -Wextra -Werror /tmp/hvf.c -framework Hypervisor -o /tmp/hvf
        codesign --force --sign - --entitlements /tmp/hvf.plist /tmp/hvf
        codesign --verify --verbose /tmp/hvf
        codesign --display --entitlements - /tmp/hvf
        cat > /tmp/vz.m <<'OBJC'
        #import <Foundation/Foundation.h>
        #import <Virtualization/Virtualization.h>
        int main(void) {
            @autoreleasepool {
                printf("VZVirtualMachine.isSupported=%d\n", VZVirtualMachine.isSupported);
                printf("VZGenericPlatformConfiguration.isNestedVirtualizationSupported=%d\n", VZGenericPlatformConfiguration.isNestedVirtualizationSupported);
            }
            return 0;
        }
        OBJC
        clang -Wall -Wextra -Werror /tmp/vz.m -framework Foundation -framework Virtualization -o /tmp/vz
        cat > /tmp/vz.plist <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <plist version="1.0"><dict><key>com.apple.security.virtualization</key><true/></dict></plist>
        PLIST
        codesign --force --sign - --entitlements /tmp/vz.plist /tmp/vz
        /tmp/vz
        user_result=0
        /tmp/hvf || user_result=$?
        root_result=0
        sudo /tmp/hvf || root_result=$?
        echo "HVF user exit=$user_result; root exit=$root_result" | tee -a "$GITHUB_STEP_SUMMARY"
        exit "$root_result"

name: Native schema bootstrap qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NIGHTLY: nightly-2026-07-06
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: avrea-ubuntu-latest-arm-4-vcpu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: 77944b4dc400f52c95b581b0a44ef1ba576d4900
          path: old
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: pichi-vm/fedora
          ref: 9350482e991706bd75c025ad29c8a1ac4179c662
          path: fedora
          persist-credentials: false
      - name: Prepare native host
        run: |
          sudo chmod a+rw /dev/kvm
          sudo sysctl -w vm.nr_hugepages=2048
          test -r /dev/kvm && test -w /dev/kvm
          test "$(cat /proc/sys/vm/nr_hugepages)" -ge 2048
          rustup toolchain install "$NIGHTLY" --profile minimal
          rustup default "$NIGHTLY"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            old -> target
          cache-targets: false
          cache-directories: |
            ${{ github.workspace }}/target
            ${{ github.workspace }}/old/target
      - name: Build both host schema versions
        run: |
          cargo build --locked --bin pichi
          (cd old && cargo build --locked --bin pichi)
      - name: Build the matching native monitor
        run: python3 .github/scripts/build_monitor.py
      - name: Build both native PMI consumers
        run: |
          for generation in old current; do
            lock=Cargo.lock
            if [ "$generation" = old ]; then lock=old/Cargo.lock; fi
            revision=$(python3 -c 'import sys,tomllib; lock=tomllib.load(open(sys.argv[1], "rb")); print(next(p["source"].rsplit("#",1)[1] for p in lock["package"] if p["name"] == "dillo"))' "$lock")
            cargo --config "$GITHUB_WORKSPACE/.cargo/config.toml" install \
              --git https://github.com/pichi-vm/dillo --rev "$revision" --locked --bin dillo \
              --root "$GITHUB_WORKSPACE/target/dillo-$generation" \
              --target-dir "$GITHUB_WORKSPACE/target/dillo-build-$generation" dillo
          done
      - name: Build and qualify current images
        run: bash .github/qualification/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: ignore
      - name: Remove monitor checkout
        if: always()
        run: python3 .github/scripts/build_monitor.py --cleanup

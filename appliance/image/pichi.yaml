version: 1

stages:
  appliance:
    extend: ghcr.io/pichi-vm/fedora:43
    mounts:
      /run: tmpfs
      /tmp: tmpfs
      /var: tmpfs
    steps:
      - copy: { path: appliance/image/pichi.repo, into: /etc/yum.repos.d/pichi.repo }
      - exec:
          command: >-
            dnf -y --setopt=install_weak_deps=False --exclude='kernel*' install
            conglobate pichi-lsm chrony systemd-networkd systemd-resolved
          network: true
      - copy: { path: appliance/image/run-pichi-repo.mount, into: /usr/lib/systemd/system/run-pichi-repo.mount }
      - copy: { path: appliance/image/run-pichi-cache.mount, into: /usr/lib/systemd/system/run-pichi-cache.mount }
      - copy: { path: appliance/image/run-pichi-output.mount, into: /usr/lib/systemd/system/run-pichi-output.mount }
      - copy: { path: appliance/image/conglobate-build.service, into: /usr/lib/systemd/system/conglobate-build.service }
      - copy: { path: appliance/image/bootstrap-time.service, into: /etc/systemd/system/bootstrap-time.service }
      - copy: { path: appliance/image/virtio-net.conf, into: /usr/lib/modules-load.d/virtio-net.conf }
      - copy: { path: appliance/image/wait-online.conf, into: /etc/systemd/system/systemd-networkd-wait-online.service.d/condition.conf }
      - copy: { path: appliance/image/10-build.network, into: /usr/lib/systemd/network/10-build.network }
      - exec:
          command: >-
            systemctl --root=/ enable conglobate-build.service
            systemd-networkd.service systemd-resolved.service
            systemd-networkd-wait-online.service
      - exec:
          command: touch /etc/resolv.conf
      - exec:
          command: systemctl --root=/ mask chronyd.service

image:
  root: appliance
  boot:
    inherit: ghcr.io/pichi-vm/fedora:43
    extend:
      kernel.selinux: "0"
      kernel.systemd.log_level: "warning"
      kernel.systemd.getty_auto: "no"
      kernel.systemd.tty.term.console: "dumb"

requirements:
  slot: pci
  cpus: { recommended: 2 }
  memory: { required: 2048, recommended: 4096 }
  storage: { required: 10240, recommended: max }

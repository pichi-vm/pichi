#
# A native-architecture Discoverable Partitions Specification root inside a
# 4 KiB GPT disk. The complete disk is imported into Carapace. The split root
# artifact is retained only for inspecting the filesystem during packaging.
# No ESP is needed to boot this appliance through its separate PMI.
#
# Size from contents; the GPT's declared end bounds this logical disk inside
# Carapace's larger backing extent. Align the partition to 1 MiB.

[Partition]
Type=root
Format=ext4
CopyFiles=/
Minimize=guess

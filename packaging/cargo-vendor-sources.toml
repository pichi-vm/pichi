# Git source replacements emitted by `cargo vendor` for the host CLI graph.
# `%cargo_prep -v vendor` already points crates.io at vendor/; append this
# file so git dependencies resolve offline too.
#
# Two carapace 0.1.0 crates are in the lock (pinned rev for pichi, floating
# rev for conglobate) and cannot share one vendor directory entry. The
# floating crate is vendored as carapace 0.1.1; %prep rewrites that lock
# entry to match. See packaging/pichi.spec.

[source."git+https://github.com/pichi-vm/carapace?rev=99caf7941ac8930a5761f6f843b6d8e53dd89587"]
git = "https://github.com/pichi-vm/carapace"
rev = "99caf7941ac8930a5761f6f843b6d8e53dd89587"
replace-with = "vendored-sources"

[source."git+https://github.com/pichi-vm/carapace"]
git = "https://github.com/pichi-vm/carapace"
replace-with = "vendored-sources"

[source."git+https://github.com/pichi-vm/conglobate"]
git = "https://github.com/pichi-vm/conglobate"
replace-with = "vendored-sources"

[source."git+https://github.com/pichi-vm/devmap?rev=2679426fa1d4508fc5c3bbdf643efbdbe64a3edd"]
git = "https://github.com/pichi-vm/devmap"
rev = "2679426fa1d4508fc5c3bbdf643efbdbe64a3edd"
replace-with = "vendored-sources"

[source."git+https://github.com/pichi-vm/pichi-artifact?rev=64feac956d4539fb79b9490a90480a81ef098ebb"]
git = "https://github.com/pichi-vm/pichi-artifact"
rev = "64feac956d4539fb79b9490a90480a81ef098ebb"
replace-with = "vendored-sources"

[package]
name = "pichi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pichi"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Optional extended VM tests for local investigation; CI uses command_smoke.
vm-tests = ["dep:dillo", "dep:corium"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde-saphyr = { workspace = true }
carapace.workspace = true
devmap-core.workspace = true
devmap-verity.workspace = true
conglobate = { workspace = true, features = ["yaml"] }
pichi-launch.workspace = true
dillo-config.workspace = true
madrillo = { git = "https://github.com/pichi-vm/madrillo", branch = "main", default-features = false }
interprocess = { version = "=2.4.7", features = ["tokio"] }
pichi-registry = { workspace = true, features = ["http-client"] }
pichi-storage.workspace = true
bytes.workspace = true
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
env_logger.workspace = true
futures-util = { workspace = true, features = ["sink"] }
getrandom = "0.4"
fs4.workspace = true
hex.workspace = true
humansize.workspace = true
log.workspace = true
object.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
ciborium.workspace = true
minijinja.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "io-util", "macros", "fs", "process", "sync", "time", "signal"] }
tokio-util = { workspace = true, features = ["io", "io-util", "codec"] }
toml.workspace = true
uuid.workspace = true
ruzstd = "0.9.1"
zstd = { version = "=0.13.3", default-features = false }
crossterm = { version = "0.29", default-features = false, features = ["windows"] }

# Optional guest Corium binaries for `vm-tests` only. Production builds launch
# Pichi's default build appliance; the host consumes Conglobate's types-only library.
[target.'cfg(target_arch = "x86_64")'.dependencies]
corium = { git = "https://github.com/pichi-vm/corium", branch = "main", artifact = "bin", lib = false, target = "x86_64-unknown-linux-musl", optional = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
corium = { git = "https://github.com/pichi-vm/corium", branch = "main", artifact = "bin", lib = false, target = "aarch64-unknown-linux-musl", optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
dillo = { git = "https://github.com/pichi-vm/dillo", branch = "main", artifact = "bin", optional = true }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }
command-fds = "=0.3.3"
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "process-session"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Threading"] }
widestring = "1"
win-custody = "=0.1.2"

[dev-dependencies]
gpt.workspace = true
assert_cmd.workspace = true
tempfile.workspace = true
pichi-storage.workspace = true
serde-keyvalue.workspace = true
# KVM/boot integration tests (build_*.rs, gated on `vm-tests`). These drive the
# real product binaries through their CLIs; the artifact deps build them.
wait-timeout = "0.2"
hex = "0.4"
burrow = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
portable-pty = "=0.9.0"
win32job = "=2.0.3"
winsafe = { version = "=0.0.29", features = ["user"] }

[workspace]
resolver = "2"
members = [
    # pichi-owned library crates (nested by their sole consumer, the root
    # `pichi` crate).
    "deps/pichi-storage",
    "deps/pichi-registry",
    "deps/pichi-launch",
    "deps/pichi-builder",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
self_named_module_files = "deny"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
type_complexity = "allow"
similar_names = "allow"
struct_field_names = "allow"
needless_continue = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
too_many_lines = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
uninlined_format_args = "allow"

[workspace.dependencies]
# Cross-product shared crates
carapace = { git = "https://github.com/pichi-vm/carapace", branch = "main", default-features = false, features = ["image"] }
devmap-core = { git = "https://github.com/pichi-vm/devmap", branch = "main" }
devmap-verity = { git = "https://github.com/pichi-vm/devmap", branch = "main", features = ["sha2"] }
pmi = { git = "https://github.com/pichi-vm/pmi" }
devtree = { git = "https://github.com/pichi-vm/devtree" }
# Dev-only caching URL downloader (shared by arma/dillo/e2e tests).
burrow = { git = "https://github.com/pichi-vm/burrow" }

# Use Dillo's console schema without linking its VM backends.
dillo-config = { git = "https://github.com/pichi-vm/dillo", branch = "main" }

# pichi-internal crates
pichi-launch = { path = "deps/pichi-launch" }
pichi-storage = { path = "deps/pichi-storage" }
pichi-registry = { path = "deps/pichi-registry" }
# conglobate lib (types only; see BUILD.md) — consumed by the pichi CLI.
# Resolve the library independently of the packaged build appliance.
conglobate = { git = "https://github.com/pichi-vm/conglobate", branch = "main", default-features = false }
# Error handling
anyhow = "1"
thiserror = "2"

# CLI
argh = "0.1"

# PE + CBOR
object = { version = "0.36", default-features = false, features = ["read_core", "pe", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.0.0"
serde-keyvalue = "0.1"
ciborium = "0.2"

# (FDT writer is hand-rolled in dillo/src/fdt_writer.rs because
# upstream vm-fdt rejects the literal `__overlay__` child-node name
# that DT overlay fragments require. See ARCH §7.1.)

# Memory + KVM (Linux)
vm-memory = { version = "0.17", default-features = false, features = ["backend-mmap", "backend-atomic"] }
kvm-ioctls = "0.24"
kvm-bindings = "0.14"

# Hypervisor backends
applevisor = "1"
applevisor-sys = "1"
windows-sys = { version = "0.61", features = ["Win32_System_Hypervisor"] }

# Battle-tested 16550 UART implementation (matches what the PoC
# uses) — the kernel's 8250 driver only enables ttyS0 if the probe
# (LCR, LSR, MCR loopback, scratch echo) succeeds. A hand-rolled
# stub usually fails one of those checks and Linux silently drops
# the console.
vm-superio = "0.8"

# Process / signal / fd plumbing
nix = { version = "0.30", features = ["fs", "process", "signal", "ioctl", "mman", "socket", "term"] }

# virtio-net user-mode backend: an in-process, no-privilege TCP/IP stack
# (smoltcp) plus a cross-platform host-socket event loop (mio). smoltcp is
# predominantly safe Rust, so it fits the workspace `unsafe_code = "deny"` lint;
# both are cross-platform, so they're pulled unconditionally by dillo-virtio-net.
smoltcp = { version = "0.13", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "auto-icmp-echo-reply"] }
mio = { version = "1", features = ["os-poll", "net"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Utility
zerocopy = { version = "0.8", features = ["derive"] }
vmm-sys-util = "0.15"

# Block device backends (virtio-blk + virtualized-GPT)
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
gpt = "4.1"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
sha2 = "0.10"

# pichi image-management (cache I/O, import, registry)
tempfile = "3"
libc = "0.2"
assert_cmd = "2"

# pichi async registry I/O (the workspace's first async runtime — pichi is the
# high-level orchestrator; it execs the synchronous `dillo` launcher, so tokio
# never enters the running VMM).
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
futures-util = { version = "0.3", default-features = false }
# Async fn in traits that are used as `&dyn` (BlobStore/TagDb) — native
# async-fn-in-trait is not object-safe, so the storage traits erase via this.
async-trait = "0.1"
# Portable async advisory file locking (flock/LockFileEx) for the tokio runtime.
# Pure-Rust, rustix-based (matches pichi-storage's existing rustix dep).
fs4 = { version = "1", default-features = false, features = ["tokio"] }
bytes = "1"
oci-client = { version = "0.16", default-features = false, features = ["rustls-tls"] }
http = { version = "1", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"] }

# pichi CLI + presentation
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
humansize = "2"
minijinja = "2"
toml = "1"

[profile.release]
opt-level = 3
lto = "thin"

# Optimize all dependencies even in dev. The workspace crates stay at -O0 for
# fast incremental rebuilds, but hot dependency code — SHA-256 (sha2) for
# dm-verity, zstd decode (ruzstd) — is pathologically slow unoptimized: a
# debug `pichi pull` drained a scute at ~5 MB/s, slow enough to trip a
# registry's HTTP write timeout mid-download. At -O3 the same pull is
# network-bound. Dependencies are cached, so this costs one-time compile only.
[profile.dev.package."*"]
opt-level = 3
